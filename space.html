<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RINGS space</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
</head>
<body>
<script type="module">
// Earth and the gold rings, today, on the GPU (three.js r160). Drag to turn.
// Sun direction and Earth's turn: astronomy-engine 2.1.19 (GeoVector in the J2000 equatorial frame, SiderealTime).
// Time runs WARP times faster than real so things visibly move; everything stays consistent with that clock.
// Units: 1 = Earth's equatorial radius. Frame: J2000 equatorial (x to the March equinox, z north),
// drawn in three.js as (x, y, z) -> (x, z, -y) so north is up.
// Gold rings: sun-synchronous dawn-dusk orbits (ascending node at 18:00 local time, RAAN = Sun RA + 90 deg),
// inclination from the J2 condition dOmega/dt = -1.5 J2 (Re/a)^2 n cos i = 360 deg per year.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const A = window.Astronomy;
const WARP = 60;                                                     // Earth turns once every 24 min, inner ring laps in ~1.6 min
const RE = 6378.137, MU = 398600.4418, J2 = 1.08262668e-3;
const OMS = 2 * Math.PI / (365.2422 * 86400);
const ssoInc = a => Math.acos(-2 * OMS * a * a / (3 * J2 * RE * RE * Math.sqrt(MU / a ** 3)));
const ALT = [550, 700, 850, 1000, 1150, 1300, 1450, 1600, 1750];    // km, one shell per ring
const toThree = v => new THREE.Vector3(v.x, v.z, -v.y);              // J2000 equatorial -> three.js
// Earth look: 0 = photo (default), 1..10 = stylised options, picked with ?style=N.
const STYLE = Math.min(10, Math.max(0, parseInt(new URLSearchParams(location.search).get('style')) || 0));
const T0 = Date.now(), simDate = t => new Date(T0 + t * WARP * 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.001, 1e8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enableZoom = false;                                        // turn only, no zoom
controls.enablePan = false;
controls.autoRotate = true; controls.autoRotateSpeed = 0.03;
controls.addEventListener('start', () => { controls.autoRotate = false; });

scene.add(new THREE.AmbientLight(0xffffff, 0.015));
const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
scene.add(sunLight, sunLight.target);

const loader = new THREE.TextureLoader();
const tex = (url, srgb = true) => { const t = loader.load(url); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const PL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';
const LOG_V = `#include <common>\n#include <logdepthbuf_pars_vertex>\n`, LOG_F = `#include <logdepthbuf_pars_fragment>\n`;

// Earth: NASA Blue Marble day map (three-globe 2.31.0), city lights, ocean tint, haze toward the limb, clouds, thin atmosphere.
const earth = new THREE.Group(); scene.add(earth);
const sunDir = { value: new THREE.Vector3(1, 0, 0) };
const surface = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 192), new THREE.ShaderMaterial({
  uniforms: { dayMap: { value: tex('https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-blue-marble.jpg') },
    nightMap: { value: tex(PL + 'earth_lights_2048.png') },
    specMap: { value: tex(PL + 'earth_specular_2048.jpg', false) }, sunDir, style: { value: STYLE } },
  vertexShader: LOG_V + `
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() { vUv = uv; vN = normalize(mat3(modelMatrix) * normal); vP = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: LOG_F + `
    uniform sampler2D dayMap, nightMap, specMap; uniform vec3 sunDir; uniform int style; varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() {
      #include <logdepthbuf_fragment>
      vec3 N = normalize(vN), V = normalize(cameraPosition - vP);
      float l = dot(N, sunDir), lit = max(l, 0.0);
      // Softer than the raw map: a little less saturation and contrast, shadows lifted.
      vec3 raw = texture2D(dayMap, vUv).rgb;
      raw = pow(mix(vec3(dot(raw, vec3(0.3, 0.59, 0.11))), raw, 0.82), vec3(0.88));
      vec3 day = raw * lit * 1.0;
      float ocean = texture2D(specMap, vUv).r;
      day += vec3(0.0, 0.012, 0.03) * ocean * lit;                                        // water is blue, not black
      float limb = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      day += vec3(0.12, 0.26, 0.6) * limb * lit * 0.7;                                     // atmospheric haze
      vec3 night = texture2D(nightMap, vUv).rgb * vec3(1.2, 0.9, 0.6) * 1.4 * smoothstep(0.05, -0.15, l);
      vec3 c = day + night;
      if (style > 0) {
        // Stylised looks, for choosing (?style=1..10). Built from the same maps: colour, ocean mask, city lights.
        vec3 tx = texture2D(dayMap, vUv).rgb; float lum = dot(tx, vec3(0.3, 0.59, 0.11)), land = 1.0 - ocean;
        float soft = smoothstep(-0.25, 0.65, l), dk = 1.0 / 2048.0;
        float coast = clamp(abs(texture2D(specMap, vUv + vec2(dk, 0.0)).r - texture2D(specMap, vUv - vec2(dk, 0.0)).r)
                          + abs(texture2D(specMap, vUv + vec2(0.0, dk)).r - texture2D(specMap, vUv - vec2(0.0, dk)).r), 0.0, 1.0);
        float grid = max(step(0.485, abs(fract(vUv.x * 24.0) - 0.5)), step(0.47, abs(fract(vUv.y * 12.0) - 0.5)));
        vec3 lights = texture2D(nightMap, vUv).rgb * smoothstep(0.05, -0.15, l);
        if (style == 1)       c = mix(vec3(0.03, 0.10, 0.26), floor(mix(vec3(0.45, 0.38, 0.22), tx * 1.6, 0.5) * 5.0) / 5.0, land) * (0.08 + soft) + lights * 0.8;   // painterly
        else if (style == 2)  c = mix(vec3(0.01, 0.04, 0.16), vec3(1.0, 0.82, 0.55), clamp(lum * 2.2, 0.0, 1.0)) * (0.04 + soft);         // retro duotone
        else if (style == 3)  c = vec3(0.004, 0.015, 0.04) + coast * vec3(0.35, 0.65, 1.0) * 1.4 + grid * vec3(0.1, 0.2, 0.35) * 0.35;   // blueprint
        else if (style == 4)  c = vec3(lum * 1.4) * (0.03 + soft) + vec3(lights.r) * 0.6;                                              // silver film
        else if (style == 5)  c = lights * vec3(1.4, 1.0, 0.5) * 1.6 + coast * vec3(0.4, 0.3, 0.15) * 0.25;                           // night lights only
        else if (style == 6)  c = vec3(0.92, 0.89, 0.82) * pow(lum * 1.6, 0.8) * (0.1 + 0.9 * soft);                                    // ink wash
        else if (style == 7)  c = mix(vec3(0.01, 0.025, 0.09), vec3(0.85, 0.62, 0.26) * (0.6 + lum), land) * (0.08 + soft) + lights * vec3(1.0, 0.7, 0.3); // navy and gold
        else if (style == 8)  c = coast * vec3(1.0, 0.78, 0.4) * 1.3 + grid * vec3(0.5, 0.4, 0.2) * 0.25 + land * vec3(0.04, 0.03, 0.015); // gold hologram
        else if (style == 9)  c = (mix(tx, vec3(lum), 0.45) * 1.5 + 0.06) * (0.35 + 0.65 * soft);                                      // pastel watercolour
        else                  c = mix(vec3(0.16, 0.30, 0.46), vec3(0.72, 0.64, 0.5), land) * (0.12 + 0.88 * soft);                     // matte clay
      }
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
earth.add(surface);
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.005, 160, 160),
  new THREE.MeshLambertMaterial({ map: tex(PL + 'earth_clouds_1024.png'), transparent: true, opacity: 0.9, depthWrite: false }));
earth.add(clouds);
// A second, slightly higher cloud layer, offset in longitude, so cover looks closer to the real ~2/3.
const clouds2 = new THREE.Mesh(new THREE.SphereGeometry(1.009, 160, 160), clouds.material.clone());
clouds2.material.opacity = 0.55; clouds2.rotation.y = 2.1; clouds2.rotation.x = 0.35;
earth.add(clouds2);
clouds.visible = clouds2.visible = false;
if ([2, 4, 6, 7].includes(STYLE)) clouds.material.opacity = 0.45;
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.016, 128, 128), new THREE.ShaderMaterial({
  uniforms: { sunDir },
  vertexShader: LOG_V + `
    varying vec3 vNv; varying vec3 vNw;
    void main() { vNv = normalize(normalMatrix * normal); vNw = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: LOG_F + `
    uniform vec3 sunDir; varying vec3 vNv; varying vec3 vNw;
    void main() {
      #include <logdepthbuf_fragment>
      float rim = pow(clamp(1.0 + dot(vNv, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 7.0);
      float lit = smoothstep(-0.2, 0.4, dot(vNw, sunDir));
      gl_FragColor = vec4(vec3(0.3, 0.55, 1.0) * rim * lit * 0.6, 1.0);
    }`,
  side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
})));

// Gold rings, built with the ascending node on +x and turned about the pole to RAAN = Sun RA + 90 deg each frame.
const rings = new THREE.Group(); scene.add(rings);
const GOLD = new THREE.Color(0.86, 0.82, 0.74), ringMats = [];       // pale champagne, barely gold
ALT.forEach((alt, k) => {
  const a = RE + alt, i = ssoInc(a), r = a / RE;
  const u = toThree({ x: 1, y: 0, z: 0 }), h = toThree({ x: 0, y: -Math.sin(i), z: Math.cos(i) });
  const v = new THREE.Vector3().crossVectors(h, u);
  const N = 900 + k * 220, phase = new Float32Array(N), seed = new Float32Array(N);
  for (let j = 0; j < N; j++) { phase[j] = Math.random() * Math.PI * 2; seed[j] = Math.random(); }
  const spread = new Float32Array(N).map(() => (Math.random() - 0.5) * 150 / RE);   // +-75 km: shells merge into one band
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  g.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  g.setAttribute('spread', new THREE.BufferAttribute(spread, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, u: { value: u }, v: { value: v }, r: { value: r }, w: { value: Math.sqrt(MU / a ** 3) },
      color: { value: GOLD }, reveal: { value: 0 }, px: { value: renderer.getPixelRatio() } },
    vertexShader: LOG_V + `
      attribute float phase; attribute float seed; attribute float spread; uniform float t, r, w, px; uniform vec3 u, v; varying float vA;
      void main() {
        float th = phase + t * w;                                  // real mean motion, on the warped clock
        vec4 mv = modelViewMatrix * vec4((r + spread) * (cos(th) * u + sin(th) * v), 1.0);
        gl_Position = projectionMatrix * mv;
        #include <logdepthbuf_vertex>
        vA = 0.45 + 0.35 * abs(sin(t * 0.004 + seed * 40.0));
        gl_PointSize = max(1.5, px * (1.0 + 1.4 * seed) * 6.0 / -mv.z);
      }`,
    fragmentShader: LOG_F + `
      uniform vec3 color; uniform float reveal; varying float vA;
      void main() {
        #include <logdepthbuf_fragment>
        float a = smoothstep(0.5, 0.0, length(gl_PointCoord - 0.5)) * vA * reveal;
        gl_FragColor = vec4(color * a * 0.38, a);
      }`,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
  ringMats.push(m);
  rings.add(new THREE.Points(g, m));
  const line = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 257 }, (_, j) => {
    const th = j / 256 * Math.PI * 2; return u.clone().multiplyScalar(Math.cos(th) * r).add(v.clone().multiplyScalar(Math.sin(th) * r));
  }));
  const lm = new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  m.userData.line = lm;
  rings.add(new THREE.Line(line, lm));
});

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.3, 0.95));
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// Place everything for a given simulated time.
function place(t) {
  const d = simDate(t);
  const s = toThree(A.GeoVector(A.Body.Sun, d, true)).normalize();
  sunDir.value.copy(s);
  sunLight.position.copy(s).multiplyScalar(100); sunLight.target.position.set(0, 0, 0);
  const raSun = Math.atan2(-s.z, s.x);                               // angle about the pole in three.js = right ascension
  rings.rotation.y = raSun + Math.PI / 2;
  // Earth's turn: Greenwich (map longitude 0, which SphereGeometry puts on +x) sits at the sidereal time.
  surface.rotation.y = A.SiderealTime(d) * Math.PI / 12;
  clouds.rotation.y = surface.rotation.y + t * 0.002;
  clouds2.rotation.y = surface.rotation.y + 2.1 - t * 0.003;
}

// Start: looking at the rings from the dusk side, a little above the equator.
place(0);
{
  const s = sunDir.value.clone(); s.y = 0; s.normalize();
  const dir = s.applyAxisAngle(new THREE.Vector3(0, 1, 0), -55 * Math.PI / 180); dir.y = 0.28;
  camera.position.copy(dir.normalize().multiplyScalar(6.2));
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  place(t);
  ringMats.forEach((m, k) => {
    const a = THREE.MathUtils.smoothstep(t, 0.4 + k * 0.45, 1.4 + k * 0.45);
    m.uniforms.t.value = t * WARP; m.uniforms.reveal.value = a; m.userData.line.opacity = 0.0;
  });
  controls.update();
  composer.render();
});
</script>
</body>
</html>
